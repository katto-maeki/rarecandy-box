<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Actividades - Sorelle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <link rel="stylesheet" href="trainer.css">
    <link rel="stylesheet" href="actividades.css">
</head>
<body class="bg-main">
    <div class="screen-frame">
<header class="top-bar">
    <div style="display: flex; align-items: center; gap: 12px;">
        <button id="btn-menu" class="nav-btn-icon" title="Abrir Menú" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">
            <i class="fa fa-bars"></i>
        </button>
        <span class="top-bar-title">Registro de actividades</span>
    </div>

    <div class="top-bar-right">
        <span class="top-bar-trainer" id="trainer-label">Entrenador: ???</span>
    </div>
</header>

    <nav id="side-menu" class="side-nav hidden">
      <div class="side-nav-content">
        <button id="btn-close-menu" class="close-btn">&times;</button>
        <h3 class="menu-title">MENÚ</h3>
        <div class="menu-links">
          <a href="perfil.html" class="menu-link"><i class="fa fa-user"></i> Perfil</a>
          <a href="social.html" class="menu-link"><i class="fa fa-users"></i> Plaza Sorelle</a>
          <a href="cajapkm.html" class="menu-link"><i class="fa fa-archive"></i> Caja pokémon</a>
          <a href="trainer.html" class="menu-link"><i class="fa fa-money"></i> Inventario</a>
          <a href="actividades.html" class="menu-link"><i class="fa fa-list-alt"></i> Actividades</a>
          <a href="guarderia.html" class="menu-link"><i class="fa fa-asterisk"></i> Incubadora</a>
          <a href="pokedex.html" class="menu-link"><i class="fa fa-search"></i> Pokédex Comunitaria</a>
          <a href="tablas.html" class="menu-link"><i class="fa fa-question-circle"></i> Info. General</a>
          <hr style="border: 0; border-top: 1px dashed #c957b0; margin: 10px 0;">
          <a href="#" id="btn-logout-side" class="menu-link" style="color: #e53e3e;"><i class="fa fa-sign-out"></i> Salir</a>
        </div>
      </div>
    </nav>

        <main class="trainer-layout">
            <div class="trainer-columns activities-grid">
                
                <section class="trainer-column">
                    <h2 class="column-title">Nueva Entrada</h2>
                    <div class="modal-body">
                        <div class="modal-row">
                            <label class="label">Nombre de la Actividad</label>
                            <input type="text" id="activity-name-input" class="input" placeholder="Ej: Encuentro en el bosque">
                        </div>

                        <div class="modal-row">
                            <label class="label">Tipo de actividad</label>
                            <select id="select-activity" class="input">
                                <option value="">-- Seleccionar --</option>
                                <option value="encounter">Encounter</option>
                                <option value="exploration">Exploración</option>
                                <option value="quest">Quest</option>
                                <option value="egg_challenge">Reto Huevo</option>
                                <option value="pokedex_comu">Pokédex Comunitaria</option>
                                <option value="pokedex_legen">Pokédex Legendaria</option>
                                <option value="coloring">Coloreo</option>
                                <option value="pokewords">Pokéwords</option>
                                <option value="freemode">Freemode</option>
                                <option value="passport">Passport</option>
                                <option value="evolution_narrative">Evolución</option>
                                <option value="trade_narrative">Intercambio</option>
                                <option value="checkpoint">Checkpoint</option>
                                <option value="otros_manual">Otros (Personalizado)</option>
                            </select>
                        </div>

                        <div class="modal-row hidden" id="encounter-qty-row">
                            <label class="label">¿Cuántos Pokémon mencionaste / coloreaste?</label>
                            <input type="number" id="input-qty-pkm" class="input" value="1" min="1">
                            <small style="font-size: 0.7rem; color: #7a47ff;">* Recompensa multiplicada por ejemplar.</small>
                        </div>

                        <div class="modal-row" id="participation-row">
                            <label class="label">Participación</label>
                            <select id="select-participation" class="input">
                                <option value="individual">Individual</option>
                                <option value="pareja">En Pareja</option>
                                <option value="grupal">Grupal</option>
                            </select>
                        </div>

                        <div id="custom-rewards-row" class="modal-row-grid hidden">
                            <div>
                                <label class="label">Pokécoins</label>
                                <input type="number" id="custom-money" class="input" value="0">
                            </div>
                            <div>
                                <label class="label">EXP</label>
                                <input type="number" id="custom-xp" class="input" value="0">
                            </div>
                        </div>

                        <div class="modal-row">
                            <label class="label">Enlace al Post</label>
                            <input type="url" id="activity-link" class="input" placeholder="https://...">
                        </div>

                        <button id="btn-add-activity" class="btn-primary full-width-btn">Registrar Actividad</button>
                    </div>
                </section>

                <section class="trainer-column">
                    <h2 class="column-title">DIARIO DE ACTIVIDADES</h2>
                    <div id="activity-log-container" class="log-scroll-area">
                        <p class="empty-msg">Cargando registros...</p>
                    </div>
                </section>
                
                <div id="modal-edit-log" class="modal-backdrop hidden">
                    <div class="modal" style="width: 450px;">
                        <h3 class="modal-title">Editar Registro</h3>
                        
                        <div class="modal-body">
                            <input type="hidden" id="edit-log-id">
                            
                            <div class="modal-row">
                                <label class="label">Nombre de la Actividad</label>
                                <input type="text" id="edit-log-name" class="input">
                            </div>
                            
                            <div class="modal-row" style="margin-top: 10px;">
                                <label class="label">Enlace / Link</label>
                                <input type="url" id="edit-log-link" class="input">
                            </div>
                        </div>
                        <button class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
                        <button class="btn-primary" onclick="saveLogEdit()">Guardar Cambios</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./core.js"></script>
    <script src="./actividades.js"></script>
</body>
</html>
